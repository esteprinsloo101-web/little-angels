<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Letter Tracing A–F — Little Angels</title>
<style>
@page { size: A4; margin: 12mm; }
* { box-sizing: border-box; }
body { font-family: "Segoe UI", system-ui, sans-serif; color: #4A3F35; margin: 0; padding: 8mm; }
h1 { font-size: 1.4rem; margin: 0 0 0.25rem; color: #E8907A; }
.sub { font-size: 0.85rem; color: #6B5E52; margin-bottom: 1rem; }

.grid { display: grid; gap: 10px; }
.trace { border: 2px dashed #F4A896; border-radius: 12px; min-height: 64px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700; color: #DDD0C8; }

.row { display: grid; grid-template-columns: 48px 1fr 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 10px; }

<p class="sub">Ages ~4–6 · Trace each letter with a finger, then a pencil. Parent/guardian supervised.</p>

<div class="row"><div class="letter">F</div><div class="trace">F</div><div class="trace">F</div><div class="trace">F</div></div>
