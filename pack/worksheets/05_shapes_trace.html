<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Shapes Trace &amp; Name — Little Angels</title>
<style>
@page { size: A4; margin: 12mm; }
* { box-sizing: border-box; }
body { font-family: "Segoe UI", system-ui, sans-serif; color: #4A3F35; margin: 0; padding: 8mm; }
h1 { font-size: 1.4rem; margin: 0 0 0.25rem; color: #E8907A; }
.sub { font-size: 0.85rem; color: #6B5E52; margin-bottom: 1rem; }
.disclaimer { font-size: 0.7rem; color: #6B5E52; border-top: 1px solid #FFE4D6; margin-top: 1.5rem; padding-top: 0.5rem; }
.trace { border: 2px dashed #F4A896; border-radius: 12px; min-height: 64px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700; color: #DDD0C8; }
.box { border: 2px solid #FFE4D6; border-radius: 10px; padding: 8px; text-align: center; min-height: 48px; }
.card { border: 2px solid #E0D4F0; border-radius: 12px; padding: 12px; text-align: center; break-inside: avoid; }
.card .word { font-size: 1.6rem; font-weight: 700; }
.card .lang { font-size: 0.7rem; color: #6B5E52; text-transform: uppercase; letter-spacing: 0.05em; }
@media print { .noprint { display: none; } body { padding: 0; } }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.item { border: 2px solid #C8E6D0; border-radius: 16px; padding: 16px; text-align: center; }
.shape { margin: 12px auto; }
.circle { width: 70px; height: 70px; background: #F4A896; border-radius: 50%; }
.square { width: 70px; height: 70px; background: #B8D4E8; border-radius: 6px; }
.triangle { width: 0; height: 0; border-left: 40px solid transparent; border-right: 40px solid transparent; border-bottom: 70px solid #7BC98A; background: transparent; }
.rect { width: 100px; height: 55px; background: #E0D4F0; border-radius: 6px; margin: 12px auto; }

<h1>Shapes · trace &amp; name</h1>
<p class="sub">Grade R / ages ~4–6 enrichment. Trace the outline with a finger, then write or say the name.</p>

  <div class="item"><div class="shape circle"></div><div class="label">circle</div></div>
  <div class="item"><div class="shape square"></div><div class="label">square</div></div>
  <div class="item"><div class="shape triangle"></div><div class="label">triangle</div></div>
  <div class="item"><div class="rect"></div><div class="label">rectangle</div></div>
</div>
