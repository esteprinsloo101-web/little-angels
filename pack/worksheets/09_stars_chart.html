<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>10-Minute Stars Chart — Little Angels</title>
<style>
@page { size: A4; margin: 12mm; }
* { box-sizing: border-box; }
body { font-family: "Segoe UI", system-ui, sans-serif; color: #4A3F35; margin: 0; padding: 8mm; }
h1 { font-size: 1.4rem; margin: 0 0 0.25rem; color: #E8907A; }
.sub { font-size: 0.85rem; color: #6B5E52; margin-bottom: 1rem; }
.disclaimer { font-size: 0.7rem; color: #6B5E52; border-top: 1px solid #FFE4D6; margin-top: 1.5rem; padding-top: 0.5rem; }
.trace { border: 2px dashed #F4A896; border-radius: 12px; min-height: 64px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700; color: #DDD0C8; }
.box { border: 2px solid #FFE4D6; border-radius: 10px; padding: 8px; text-align: center; min-height: 48px; }
.card { border: 2px solid #E0D4F0; border-radius: 12px; padding: 12px; text-align: center; break-inside: avoid; }
.card .word { font-size: 1.6rem; font-weight: 700; }
.card .lang { font-size: 0.7rem; color: #6B5E52; text-transform: uppercase; letter-spacing: 0.05em; }
@media print { .noprint { display: none; } body { padding: 0; } }

.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.day { border: 2px solid #FFEAA7; border-radius: 12px; min-height: 72px; text-align: center; padding: 8px; }
.day .n { font-weight: 700; color: #E8907A; }
</style></head><body>

<p class="sub">Colour a star each day you practise ~10 minutes. Kindness over streaks. Parent/guardian supervised.</p>

  <div class="day"><div class="n">9</div>⭐</div>
  <div class="day"><div class="n">10</div>⭐</div>
</div>
<p class="sub" style="margin-top:1rem;">What I liked most: ________________________________</p>
<p class="disclaimer">Little Angels · Enrichment habit chart · Not a school report · Not CAPS-certified</p>
